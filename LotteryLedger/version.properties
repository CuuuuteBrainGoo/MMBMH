# 版本号唯一来源 —— 改这里就够了，build.gradle.kts 会读它。
#
# 规则（2026-09-27 少爷指出「迭代很多版本但版本号一直没动」后立的规矩）：
#  - versionCode 每次交付 APK 必须 +1（Android 用它判断「是不是新版本」）
